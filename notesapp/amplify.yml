version: 1
applications:
  - appRoot: notesapp
    backend:
      phases:
        build:
          commands:
            # Use npm install (not npm ci): Amplify's npm is stricter about
            # incomplete nested pins in Amplify Gen 2 lockfiles from newer local npm.
            - npm install --cache .npm --prefer-offline
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        build:
          commands:
            - echo "Static site — no frontend build step"
      artifacts:
        baseDirectory: .
        files:
          - index.html
          - app.js
          - styles.css
          - amplify_outputs.json
      cache:
        paths:
          - .npm/**/*
          - node_modules/**/*
